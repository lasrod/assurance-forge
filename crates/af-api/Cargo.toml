[package]
name = "af-api"
description = "The frontend contract: open a document, and answer the queries the interface asks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Derives the TypeScript types of the contract (`ts-rs`). Only the crate's own
# tests turn it on, to write and check `bindings/api.ts`; the shells serialize
# the same types with serde.
typescript = ["dep:ts-rs"]

[dependencies]
af-gsn = { path = "../af-gsn" }
af-layout = { path = "../af-layout" }
af-session = { path = "../af-session" }
sacm = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
af-api = { path = ".", features = ["typescript"] }
serde_json = "1.0.154"

[lints]
workspace = true
