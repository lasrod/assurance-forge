filter = src/
exclude = external/
exclude = build-coverage/
exclude = _deps/
# Pure ImGui rendering layer
exclude = src/ui/
# App: window/runtime loop + entrypoint glue (not unit-testable without a render harness)
exclude = src/app/main\.cpp
exclude = src/app/app_runtime.*\.cpp
exclude = src/app/app_ui_bootstrap\.cpp
exclude = src/app/native_file_dialogs\.cpp
# App: ImGui rendering areas + window frame
exclude = src/app/areas/
exclude = src/app/frame/
exclude-throw-branches =
exclude-unreachable-branches =
