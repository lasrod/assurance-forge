[workspace]
resolver = "3"
members = ["crates/af-api", "crates/af-gsn", "crates/af-layout", "crates/af-wasm"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lasrod/assurance-forge"
homepage = "https://github.com/lasrod/assurance-forge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Shaping is most of a layout's time; unoptimised, the tests take 30 s.
[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
