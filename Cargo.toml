[workspace]
resolver = "3"
members = ["crates/af-gsn"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lasrod/assurance-forge"
homepage = "https://github.com/lasrod/assurance-forge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
