# Dependabot opens a pull request; a person reads it and CI decides whether it
# merges. Nothing here updates anything on its own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"

  # The SCCG guidelines and the example cases.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      submodules:
        patterns:
          - "*"

  # Workflow actions run third-party code with repository credentials.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
