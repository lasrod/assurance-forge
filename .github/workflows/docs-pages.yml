name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .clang-uml
      - src/**
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev \
            libssl-dev libcurl4-openssl-dev

      - name: Install clang-uml (pinned release)
        env:
          CLANG_UML_VERSION: "0.6.2"
        run: |
          set -euo pipefail

          package_url="https://github.com/bkryza/clang-uml/releases/download/${CLANG_UML_VERSION}/clang-uml_${CLANG_UML_VERSION}-0ubuntu1ppa1.noble_amd64.deb"
          package_path="${RUNNER_TEMP}/clang-uml.deb"

          curl -fL "$package_url" -o "$package_path"
          sudo apt-get install -y "$package_path"
          clang-uml --version

      - name: Generate compile database
        run: |
          cmake -S . -B build-docs -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHELLOIMGUI_DOWNLOAD_GLFW_IF_NEEDED=ON

      - name: Generate Mermaid class diagrams
        run: clang-uml -g mermaid

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Download Mermaid JS
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js \
               -o docs/javascripts/mermaid.min.js

      - name: Build MkDocs (strict)
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4