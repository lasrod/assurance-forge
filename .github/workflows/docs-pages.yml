name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .clang-uml
      - src/**
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev \
            libssl-dev libcurl4-openssl-dev

      - name: Install clang-uml (pinned release)
        env:
          CLANG_UML_VERSION: "0.6.2"
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/bkryza/clang-uml/releases/tags/${CLANG_UML_VERSION}"
          asset_url=$(curl -fsSL "$api_url" \
            | grep -oE 'https://[^\"]+' \
            | grep -Ei '/download/.*/.*(linux|ubuntu).*(x86_64|amd64).*(tar\.gz|tgz)$' \
            | head -n1)

          if [ -z "$asset_url" ]; then
            echo "Failed to find Linux x86_64 release asset for clang-uml ${CLANG_UML_VERSION}" >&2
            exit 1
          fi

          tmp_dir=$(mktemp -d)
          archive_path="$tmp_dir/clang-uml.tar.gz"

          curl -fL "$asset_url" -o "$archive_path"
          tar -xzf "$archive_path" -C "$tmp_dir"

          clang_uml_bin=$(find "$tmp_dir" -type f -name clang-uml | head -n1)
          if [ -z "$clang_uml_bin" ]; then
            echo "clang-uml binary was not found in extracted archive" >&2
            exit 1
          fi

          sudo install -m 0755 "$clang_uml_bin" /usr/local/bin/clang-uml
          clang-uml --version

      - name: Generate compile database
        run: |
          cmake -S . -B build-docs -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHELLOIMGUI_DOWNLOAD_GLFW_IF_NEEDED=ON

      - name: Generate Mermaid class diagrams
        run: clang-uml -g mermaid

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Download Mermaid JS
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js \
               -o docs/javascripts/mermaid.min.js

      - name: Build MkDocs (strict)
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4