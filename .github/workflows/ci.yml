name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs: when a PR branch gets a new push, the in-progress run
# for the previous commit is no longer interesting. main pushes are keyed by SHA
# so they never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # Let CMake pick the newest Visual Studio installed on the runner
            # rather than pinning a version — windows-latest's VS rolls forward.
            # No ccache: MSVC caching needs embedded debug info (/Z7) and is
            # fragile to set up blind; left for a follow-up.
            configure: cmake -B build -A x64 -DAF_WARNINGS_AS_ERRORS=ON
            build: cmake --build build --config Debug
            test: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
            use_ccache: false
          - name: Linux
            os: ubuntu-latest
            configure: cmake -B build -DAF_WARNINGS_AS_ERRORS=ON -DHELLOIMGUI_DOWNLOAD_GLFW_IF_NEEDED=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            build: cmake --build build
            test: ctest --test-dir build --output-on-failure --no-tests=error
            use_ccache: true
          - name: macOS
            os: macos-latest
            configure: cmake -B build -DAF_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            build: cmake --build build
            test: ctest --test-dir build --output-on-failure --no-tests=error
            use_ccache: true

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev libsecret-1-dev

      # The catalog and SACM/GSN/capability matrix gates only register when CMake
      # finds a Python interpreter. Pin one explicitly rather than relying on the
      # runner image shipping it, so the gates cannot silently disappear.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Caches compiled objects across runs, including the FetchContent
      # dependencies (curl, hello_imgui, yaml-cpp, googletest) which are pinned
      # and rarely change — that rebuild is most of the build time. AppleClang
      # and GCC cache reliably; the cache is keyed per OS by the action.
      - name: Set up ccache
        if: matrix.use_ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      - name: Configure CMake
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Run tests
        run: ${{ matrix.test }}

      # The libsecret path would otherwise be COMPILED but never EXECUTED.
      # A GitHub Linux runner has no keyring, so SecretStore's round trip
      # skips there and the save/lookup/delete calls go untested on the one
      # platform that needed them written (#53). macOS runs them against the
      # real Keychain in the step above; this gives Linux the same evidence
      # by starting a keyring rather than by lowering the bar.
      #
      # Deliberately its own step rather than wrapping `matrix.test`:
      # putting all 1281 tests inside a dbus session to serve six of them
      # changes the environment of everything else for no reason.
      - name: Secret store against a real keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ./build/tests --gtest_filter=SecretStore.* 2>&1 | tee /tmp/secret-store.log
            exit ${PIPESTATUS[0]}
          '
          # gtest exits 0 on a SKIP, so a green step would otherwise prove only
          # that the keyring package installed. The round trip is the whole
          # point of this step: if it skipped, the keyring did not come up and
          # the libsecret calls are still unexecuted.
          if ! grep -q 'OK \] SecretStore.RoundTripsThroughThePlatformStore' /tmp/secret-store.log; then
            echo '::error::the round trip did not RUN - the keyring did not come up, so libsecret is still untested'
            exit 1
          fi

  # Static analysis runs as its own job rather than inside the build matrix.
  # It needs no test run, and its result is a ratchet against a committed
  # baseline rather than a pass/fail property of the build.
  #
  # Windows, because the baseline is generated there. Analysing a different
  # platform than the baseline records would compare two different sets of
  # #ifdef branches and report the difference as new findings.
  #
  # Scope differs by trigger, because a full sweep is far too slow to sit in
  # front of every pull request. The first attempt at this job ran all 255
  # translation units on a 4-core runner and was still going after 30 minutes,
  # against a repository whose median CI wall clock is 12.7 minutes.
  #
  #   pull_request -> only the .cpp files the branch touched
  #   push to main -> the full sweep, which is the authoritative one
  #
  # The gap that leaves is real and worth naming: a pull request that edits a
  # header can add findings in .cpp files it did not touch, and those are not
  # analysed until the full sweep runs after the merge. Catching it before the
  # merge would mean resolving the include graph, which this does not do.
  static-analysis:
    name: Static analysis
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Need the base commit to diff against on a pull request.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Pinned to the exact version the baseline was generated with. Using the
      # LLVM the runner image happens to ship meant the ratchet compared one
      # tool against another, and #317 records both ways that went wrong: a
      # pull request failed on a finding the baseline's version does not report,
      # and a real finding reached main because the runner's version does not
      # implement that check the same way.
      #
      # Chocolatey has no package at this granularity -- that is what defeated
      # the first attempt -- but PyPI publishes LLVM's own binaries as wheels,
      # pinnable to the patch and identical on all three platforms.
      #
      # The version lives in the baseline, so there is one place to change it:
      # regenerate the baseline with a new clang-tidy and this installs it.
      - name: Install the clang-tidy the baseline records
        shell: bash
        run: |
          pinned=$(python -c "import json;print(json.load(open('docs/quality/clang-tidy-baseline.json'))['tool_version'])")
          echo "baseline was generated by clang-tidy $pinned"
          python -m pip install --disable-pip-version-check "clang-tidy==$pinned"
          # The image's own LLVM is also on PATH and may come first, so the
          # runner is pointed at the pinned binary rather than trusting order.
          # `get_executable` is the wheel's own resolver and knows the platform
          # suffix, which differs across the three runners.
          resolved=$(python -c "import clang_tidy;print(clang_tidy.get_executable('clang-tidy'))")
          echo "CLANG_TIDY=$resolved" >> "$GITHUB_ENV"
          "$resolved" --version

      # Configure only. The analysis needs the FetchContent dependency headers
      # under build/_deps, not compiled objects, so the build itself is skipped.
      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Check changed sources (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.cpp')
          if [ ${#changed[@]} -eq 0 ]; then
            echo "no .cpp files changed; the full sweep on main covers the rest"
            exit 0
          fi
          echo "changed .cpp files:"
          for f in "${changed[@]}"; do echo "  $f"; done
          python tools/quality/run_clang_tidy.py --check --jobs 4 --paths "${changed[@]}"

      - name: Check every source (main)
        if: github.event_name != 'pull_request'
        run: python tools/quality/run_clang_tidy.py --check --jobs 4

      # Complexity is REPORT MODE, deliberately (#343). It measures and prints;
      # it does not gate. `--check` exists and is tested, so turning the ratchet
      # on later is this line gaining four characters rather than a project --
      # but the policy says report before ratchet, and 172 functions over the
      # threshold is a number to triage, not to freeze by accident.
      - name: Measure complexity (report only)
        shell: bash
        run: |
          pinned=$(python -c "import json;print(json.load(open('docs/quality/complexity-baseline.json'))['tool_version'])")
          python -m pip install --disable-pip-version-check "lizard==$pinned"
          python tools/quality/run_complexity.py --report
