name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # Let CMake pick the newest Visual Studio installed on the runner
            # rather than pinning a version -- windows-latest's VS rolls
            # forward, and the pinned generator is exactly what broke the
            # 0.2.0-alpha.1 tag run after the runner image moved on. ci.yml
            # made this change first; this keeps the release identical.
            configure: cmake -B build -A x64
            build: cmake --build build --config Release
            test: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit test-results.xml
            binary_path: build/Release/assurance-forge.exe
            archive_suffix: windows-x64
            archive_ext: zip
          - name: Linux
            os: ubuntu-latest
            configure: cmake -B build -DHELLOIMGUI_DOWNLOAD_GLFW_IF_NEEDED=ON -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build
            test: ctest --test-dir build --output-on-failure --no-tests=error
            binary_path: build/assurance-forge
            archive_suffix: linux-x64
            archive_ext: tar.gz
          - name: macOS
            os: macos-latest
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build
            test: ctest --test-dir build --output-on-failure --no-tests=error
            binary_path: build/assurance-forge.app
            archive_suffix: macos-arm64
            archive_ext: zip

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev

      # The evidence-package gate and generator verify the normative OMG
      # sources against the pins carried in the generator. The sources are
      # fetched, not committed (OMG licensing); release runners fetch them so
      # the pin comparison actually runs where a release is produced.
      - name: Fetch SACM normative references
        shell: bash
        run: bash scripts/fetch-sacm23-references.sh

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # CPack's INNOSETUP generator needs ISCC at configure time. Installed only
      # when the runner image does not already carry it.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Configure CMake
        run: ${{ matrix.configure }} -DAF_PACKAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Build (Release)
        run: ${{ matrix.build }}

      - name: Run tests
        run: ${{ matrix.test }}

      # Windows packages come from the install() rules in cmake/packaging.cmake:
      # one staging, turned into the portable zip and the per-user installer.
      - name: Build packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cpack --config build/CPackConfig.cmake -C Release -B package

      # The build machine has DLLs a tester's may not (the VC++ runtime among
      # them), so a package that runs here proves nothing. Check each package's
      # imports resolve to Windows or to files it ships, and start the MCP
      # server from it. The installer is installed silently for the current
      # user, checked, and uninstalled again.
      - name: Check packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.version }}"
          $base = "assurance-forge.$version-${{ matrix.archive_suffix }}"

          $unzipped = Join-Path $env:RUNNER_TEMP 'af-zip'
          Expand-Archive "package/$base.zip" -DestinationPath $unzipped -Force
          python tools/release/check_windows_package.py (Join-Path $unzipped $base) --run
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $installed = Join-Path $env:RUNNER_TEMP 'af-installed'
          $setup = Start-Process "package/$base-setup.exe" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$installed`""
          if ($setup.ExitCode -ne 0) { throw "installer exited $($setup.ExitCode)" }
          python tools/release/check_windows_package.py $installed --run
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $uninstall = Start-Process (Join-Path $installed 'unins000.exe') -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited $($uninstall.ExitCode)" }

      - name: Stage package contents
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="package/assurance-forge.${{ steps.version.outputs.version }}"
          mkdir -p "$stage"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "${{ matrix.binary_path }}" "$stage/"
          else
            cp "${{ matrix.binary_path }}" "$stage/"
            cp -R assets "$stage/"
          fi
          cp -R data "$stage/"
          # The SCCG catalogue the build copied beside the binary. The macOS
          # bundle already carries it inside Contents/MacOS; elsewhere only the
          # executable was copied, so a release found no catalogue and had no
          # guideline review at all.
          if [ "$RUNNER_OS" != "macOS" ]; then
            runtime_catalogue="$(dirname "${{ matrix.binary_path }}")/data/sccg/dist/sccg.full.json"
            test -f "$runtime_catalogue"
            mkdir -p "$stage/data/sccg/dist"
            cp "$runtime_catalogue" "$stage/data/sccg/dist/"
          fi
          cp README.md "$stage/"
          cp LICENSE.md "$stage/"

      - name: Generate conformance evidence package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # ctest writes --output-junit relative to the test dir on some
          # versions and the invocation dir on others; accept either.
          junit=""
          for candidate in build/test-results.xml test-results.xml; do
            if [ -f "$candidate" ]; then junit="$candidate"; break; fi
          done
          if [ -z "$junit" ]; then
            echo "test-results.xml not found; the evidence package requires machine-readable test results" >&2
            exit 1
          fi
          python tools/sacm/generate_evidence_package.py \
            --version "${{ steps.version.outputs.version }}" \
            --toolchain "MSVC (newest Visual Studio on windows-latest), Release" \
            --test-results "$junit" \
            --require-clean \
            --out package/evidence \
            --zip "package/assurance-forge.${{ steps.version.outputs.version }}-evidence-package.zip"

      - name: Upload evidence package artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: assurance-forge-${{ steps.version.outputs.version }}-evidence-package
          path: package/assurance-forge.${{ steps.version.outputs.version }}-evidence-package.zip
          if-no-files-found: error

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage_name="assurance-forge.${version}"
          archive="package/assurance-forge.${version}-${{ matrix.archive_suffix }}.${{ matrix.archive_ext }}"
          tar -czf "$archive" -C package "$stage_name"

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage_name="assurance-forge.${version}"
          archive="package/assurance-forge.${version}-${{ matrix.archive_suffix }}.${{ matrix.archive_ext }}"
          (cd package && zip -r -y "../$archive" "$stage_name")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: assurance-forge-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}
          path: package/assurance-forge.${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: assurance-forge-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}-setup
          path: package/assurance-forge.${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: assurance-forge ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: package/assurance-forge.${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.${{ matrix.archive_ext }}
          fail_on_unmatched_files: true

      # The evidence package (#295) binds the conformance claim to this exact
      # release. Attached from the Windows job only -- one package per release,
      # generated on the platform whose binaries the release ships.
      - name: Attach evidence package to Release (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: package/assurance-forge.${{ steps.version.outputs.version }}-evidence-package.zip
          fail_on_unmatched_files: true

      - name: Attach installer to Release (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: package/assurance-forge.${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}-setup.exe
          fail_on_unmatched_files: true
