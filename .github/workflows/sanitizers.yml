name: Sanitizers

# Not on pull requests, for the same reason Coverage is not: the build cannot
# reuse the ordinary ccache (the flags differ, so every object is a miss) and
# ASan roughly doubles the test runtime. That is a long time to add to the PR
# feedback loop for a job whose value is finding latent defects rather than
# reviewing a diff.
#
# It runs after merge, weekly to catch slow drift, and on demand. A failure here
# names a real defect on main rather than blocking someone's branch, which is
# the same trade Coverage makes.
on:
  push:
    branches:
      - main
  schedule:
    # Mondays 07:00 UTC, an hour after Coverage so the two do not contend.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ASan + UBSan (Linux, GCC 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev \
            libssl-dev libcurl4-openssl-dev \
            gcc-14 g++-14

      # The catalog and matrix gates only register when CMake finds Python.
      # They are not what this job is for, but a silently absent gate reads as a
      # passing one, so keep them present here too.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # GCC 14, the same compiler Coverage pins, because it is the one known to
      # build this project. The first run of this job used Clang 18 -- chosen
      # for its symbolized traces, which is a preference rather than a
      # requirement -- and it could not compile the codebase at all:
      #
      #   src/parser/xml_parser.h:21:6: error: no template named 'expected' in
      #   namespace 'std'
      #
      # std::expected is C++23 and the ordinary Linux job compiles it happily
      # with GCC, so this was a toolchain gap rather than a defect in the code.
      # Sanitizing with a compiler that cannot build the project measures
      # nothing.
      - name: Configure CMake (sanitizer build)
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DHELLOIMGUI_DOWNLOAD_GLFW_IF_NEEDED=ON \
            -DAF_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build-asan

      # detect_leaks is left ON. abort_on_error makes ASan stop at the first
      # fault rather than continuing into undefined territory, and
      # print_stacktrace gives UBSan a trace instead of a bare source location.
      # One test is excluded, by name and with its issue, so the exclusion
      # cannot quietly become permanent.
      #
      # DeepChainTreeViewRendersWithoutStackOverflow builds a 12,000-deep chain
      # and renders it. ImGui's TreePop does `TreeDepth--` and then
      # `1 << TreeDepth` on a signed int (imgui_widgets.cpp:7219), so popping
      # the innermost of N nested levels shifts by N-1 -- undefined once that
      # reaches 32, i.e. from 33 levels deep. Correctly reported. The defect is
      # in a submodule we do not own, and the fix on our side is a UI decision
      # about how a very deep argument should render, so it is tracked rather
      # than patched here:
      #
      #   https://github.com/lasrod/assurance-forge/issues/312
      #
      # This is a parked finding, not a clean bill. The sibling test
      # DeepLinearChainDoesNotOverflowStack still runs under sanitizers and
      # passes, so the stack-overflow property both tests exist for stays
      # covered.
      - name: Run tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Anchored. Unanchored, this is a substring match and would also exclude
        # any future test whose name merely contains it -- the opposite of
        # excluding exactly one test by name.
        run: |
          ctest --test-dir build-asan --output-on-failure --no-tests=error \
            -E '^LayoutTest\.DeepChainTreeViewRendersWithoutStackOverflow$'
