name: Roadmap scripts tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/roadmap-*.yml'
      - '.github/ISSUE_TEMPLATE/roadmap-epic-request.yml'

permissions:
  contents: read

jobs:
  test-roadmap-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run roadmap script tests
        run: python -m unittest discover .github/scripts/tests
