site_name: Assurance Forge
site_description: Open-source tooling for structured assurance and safety cases
site_url: https://lasrod.github.io/assurance-forge/
repo_url: https://github.com/lasrod/assurance-forge
repo_name: lasrod/assurance-forge

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-config.js
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Features:
    - Overview: features/index.md
    - Capability Matrix: features/feature-matrix.md
    - Terminology Assist: features/terminology-assist.md
    - Confidence Panel Prototype: features/confidence-panel-prototype.md
    - MCP Server (planned): features/mcp-server.md
  - Roadmap:
    - Product Roadmap: roadmap/public.md
    - Workflow: roadmap/workflow.md
  - Standards:
    - Overview: sacm/index.md
    - GSN v3 Conformance: gsn/gsn-v3-conformance-matrix.md
    - SACM 2.3 Conformance statement: sacm/sacm-conformance-statement.md
    - SACM 2.3 Compliance points: sacm/sacm-compliance-points.md
    - SACM integration preservation: sacm/sacm-integration-preservation.md
    - SACM 2.3 Conformance: sacm/sacm-conformance-matrix.md
    - Verification Records: sacm/verification/README.md
    - SACM–GSN Mapping: sacm/sacm-gsn-mapping.md
    - GSN Metamodel Gaps: sacm/sacm-gsn-metamodel-gaps.md
  - Architecture:
      - Overview: architecture/index.md
      - Layers and Ownership: architecture/layers-and-ownership.md
      - Legacy Bridge Migration Plan: architecture/legacy-bridge-migration-plan.md
      - Runtime and State: architecture/runtime-state.md
      - Parser and SACM: architecture/parser-sacm.md
      - App Shell and UI Areas: architecture/app-shell.md
      - UI Panels: architecture/ui-panels.md
      - Controllers: architecture/controllers.md
      - Project Storage: architecture/project-storage.md
      - Review and AI: architecture/review-ai.md
      - Integrated Draft Workspace (planned): architecture/integrated-draft-workspace-plan.md
