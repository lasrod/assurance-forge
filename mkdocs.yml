site_name: Assurance Forge
site_description: Open-source tooling for structured assurance and safety cases
site_url: https://lasrod.github.io/assurance-forge/
repo_url: https://github.com/lasrod/assurance-forge
repo_name: lasrod/assurance-forge

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Roadmap:
    - Rust rebuild, Phase 0: roadmap/rust-rebuild-phase-0.md
    - "Milestone 1, step 1: the diagram": roadmap/milestone-1-diagram.md
    - "Milestone 1, step 2: the problem list": roadmap/milestone-1-problems.md
    - "Milestone 2, step 1: adding elements": roadmap/milestone-2-add-elements.md
    - "Milestone 2, step 2: saving": roadmap/milestone-2-save.md
    - "Milestone 2, step 3: the recovery copy": roadmap/milestone-2-recovery.md
    - "Milestone 2, step 4: moving an element": roadmap/milestone-2-move.md
    - Canvas spike findings: spikes/canvas.md
    - Desktop shell spike findings: spikes/desktop-shell.md
    - Moving by dragging spike findings: spikes/drag-move.md
  - Standards:
    - SACM to GSN mapping: standards/sacm-gsn-mapping.md
    - GSN metamodel gaps: standards/sacm-gsn-metamodel-gaps.md
  - C++ version:
    - Capability matrix: reference/cpp-capability-matrix.md
    - GSN v3 conformance matrix: reference/cpp-gsn-v3-conformance-matrix.md
