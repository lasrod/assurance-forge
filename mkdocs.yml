site_name: Assurance Forge
site_description: Open-source tooling for structured assurance and safety cases
site_url: https://lasrod.github.io/assurance-forge/
repo_url: https://github.com/lasrod/assurance-forge
repo_name: lasrod/assurance-forge

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-config.js
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Features:
    - Overview: features/index.md
    - Terminology Assist: features/terminology-assist.md
    - Confidence Panel Prototype: features/confidence-panel-prototype.md
  - Roadmap:
    - Product Roadmap: roadmap/public.md
    - Workflow: roadmap/workflow.md
  - Architecture:
      - Overview: architecture/index.md
      - Runtime and State: architecture/runtime-state.md
      - Parser and SACM: architecture/parser-sacm.md
      - App Shell and UI Areas: architecture/app-shell.md
      - UI Panels: architecture/ui-panels.md
      - Controllers: architecture/controllers.md
      - Project Storage: architecture/project-storage.md
      - Review and AI: architecture/review-ai.md
      - Generated Class Diagrams: architecture/generated-class-diagrams.md
  - Developer Guide:
      - Overview: developer-guide/index.md
      - Generating Class Diagrams: developer-guide/generating-class-diagrams.md