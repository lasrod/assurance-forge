# Coverage scope for the independent SACM 2.3 library.
#
# libs/sacm is the surface every SACM conformance claim rests on, so it is
# measured separately from the application: a headline number mixing the two
# would let library regressions hide behind app coverage. The sources are
# already instrumented (the root CMakeLists adds --coverage at directory scope
# before add_subdirectory(libs/sacm)) -- only the reports excluded them.
filter = libs/sacm/src/
filter = libs/sacm/include/
# Tests and the CLI smoke tool are the harness, not the code under test.
exclude = libs/sacm/tests/
exclude = libs/sacm/tools/
exclude = external/
exclude = build-coverage/
exclude = _deps/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
